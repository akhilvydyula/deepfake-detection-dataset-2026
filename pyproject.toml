[project]
name = "deepfake-detection-dataset-2026"
version = "0.1.0"
description = "Baseline pipeline for the Deepfake Detection Dataset 2026 Kaggle dataset."
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
